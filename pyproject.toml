[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gripper_descriptions"
version = "1.0.0"
description = "Real-world gripper URDF descriptions, meshes, and configs for GraspGenX"
authors = [
    {name = "Adithya Murali", email = "admurali@nvidia.com"},
]
license = {text = "NVIDIA Corporation"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["robotics", "grippers", "urdf", "manipulation", "grasping"]

dependencies = [
    "numpy",
    "trimesh",
    "yourdfpy",
    "viser",
]

[project.optional-dependencies]
render = [
    "pyrender",
    "Pillow",
    "PyOpenGL",
]

[project.urls]
"Repository" = "ssh://git@gitlab-master.nvidia.com:12051/rays2torques/graspgen/gripper_descriptions.git"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["gripper_descriptions*"]

[tool.setuptools.package-data]
"gripper_descriptions" = [
    "assets/**/*.urdf",
    "assets/**/*.obj",
    "assets/**/*.stl",
    "assets/**/*.STL",
    "assets/**/*.json",
    "assets/**/*.npy",
    "assets/**/*.md",
    "assets/**/*.txt",
]
"gripper_descriptions.figs" = ["*.png"]
